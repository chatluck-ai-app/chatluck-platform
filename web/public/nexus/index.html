<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Nexus AI</title>
<style>
  :root {
    --bg: #0a0f0d; --surface: #111815; --surface2: #1a241f; --border: #24352d;
    --text: #e8f0ec; --dim: #8fa89b; --accent: #2dd4a7; --accent2: #1a8a6c;
    --user: #1f6f54; --err: #e06060;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Segoe UI", Tahoma, Arial, sans-serif;
    display: flex; flex-direction: column; height: 100dvh; overflow: hidden;
  }
  .glow { position: fixed; border-radius: 50%; filter: blur(90px); opacity: .35; pointer-events: none; z-index: 0; }
  .glow.g1 { width: 340px; height: 340px; background: #0f5c44; top: -80px; right: -60px; animation: drift 14s ease-in-out infinite alternate; }
  .glow.g2 { width: 280px; height: 280px; background: #123f33; bottom: -70px; left: -50px; animation: drift 18s ease-in-out infinite alternate-reverse; }
  @keyframes drift { from { transform: translate(0,0) scale(1); } to { transform: translate(40px,30px) scale(1.15); } }
  header {
    position: relative; z-index: 2; display: flex; align-items: center; gap: 10px;
    padding: 12px 16px; border-bottom: 1px solid var(--border); background: rgba(10,15,13,.85); backdrop-filter: blur(8px);
  }
  .logo { font-size: 20px; font-weight: 700; color: var(--accent); letter-spacing: .5px; }
  header .spacer { flex: 1; }
  .hbtn {
    background: var(--surface2); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 7px 12px; font-size: 13px; cursor: pointer;
  }
  .hbtn:hover { border-color: var(--accent); }
  #personas {
    position: relative; z-index: 2; display: flex; gap: 6px; padding: 8px 12px;
    overflow-x: auto; border-bottom: 1px solid var(--border); scrollbar-width: none;
  }
  #personas::-webkit-scrollbar { display: none; }
  .chip {
    white-space: nowrap; font-size: 12.5px; padding: 6px 12px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--surface); color: var(--dim); cursor: pointer;
  }
  .chip.on { background: var(--accent2); color: #fff; border-color: var(--accent2); }
  #msgs { position: relative; z-index: 1; flex: 1; overflow-y: auto; padding: 16px 12px 8px; display: flex; flex-direction: column; gap: 10px; }
  .empty { margin: auto; text-align: center; color: var(--dim); }
  .empty .star { font-size: 40px; color: var(--accent); }
  .empty h2 { margin: 12px 0 6px; color: var(--text); font-size: 20px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 16px; font-size: 15px; line-height: 1.75; white-space: pre-wrap; word-break: break-word; }
  .msg.user { align-self: flex-start; background: var(--user); border-bottom-left-radius: 4px; }
  .msg.bot { align-self: flex-end; background: var(--surface2); border-bottom-right-radius: 4px; }
  .msg.bot img.att, .msg.user img.att { max-width: 100%; border-radius: 10px; display: block; margin-bottom: 8px; }
  .msg .sources { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--border); font-size: 13px; }
  .msg .sources a { color: var(--accent); display: block; margin-top: 4px; text-decoration: none; word-break: break-all; }
  .typing { align-self: flex-end; background: var(--surface2); border-radius: 16px; border-bottom-right-radius: 4px; padding: 12px 16px; color: var(--dim); font-size: 14px; }
  .typing .dot { display: inline-block; animation: blink 1.2s infinite; }
  .typing .dot:nth-child(2) { animation-delay: .2s; } .typing .dot:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }
  #err { position: relative; z-index: 2; color: var(--err); font-size: 13px; padding: 2px 16px; min-height: 18px; }
  #composer { position: relative; z-index: 2; padding: 8px 12px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--border); background: rgba(10,15,13,.9); }
  #modebar { display: none; margin-bottom: 6px; }
  #modebar .chip { position: relative; }
  #inputrow { display: flex; align-items: flex-end; gap: 6px; }
  .ibtn {
    background: none; border: none; font-size: 20px; cursor: pointer; padding: 8px 6px; color: var(--dim);
  }
  .ibtn:hover { color: var(--accent); }
  .ibtn.rec { color: var(--err); }
  #input {
    flex: 1; resize: none; max-height: 120px; padding: 11px 14px; font-size: 15px; font-family: inherit;
    background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: 22px; outline: none;
  }
  #input:focus { border-color: var(--accent); }
  #send { color: var(--accent); font-size: 22px; }
  #send:disabled { color: var(--dim); }
  #attachprev { display: none; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 13px; color: var(--accent); }
  #modemenu {
    display: none; position: absolute; bottom: 64px; right: 12px; z-index: 5;
    background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; padding: 6px; min-width: 170px;
    box-shadow: 0 8px 30px rgba(0,0,0,.5);
  }
  #modemenu button {
    display: block; width: 100%; text-align: right; background: none; border: none; color: var(--text);
    padding: 9px 10px; font-size: 14px; cursor: pointer; border-radius: 8px;
  }
  #modemenu button:hover { background: var(--surface); }
  .thumb { width: 54px; height: 54px; object-fit: cover; border-radius: 8px; }
</style>
</head>
<body>
<div class="glow g1"></div><div class="glow g2"></div>

<header>
  <span class="logo">Nexus AI</span>
  <span class="spacer"></span>
  <button class="hbtn" id="ttsbtn" title="قراءة الردود صوتيًا">🔇 صوت</button>
  <button class="hbtn" id="newchat">＋ محادثة</button>
</header>

<div id="personas"></div>
<div id="msgs"></div>
<div id="err"></div>

<div id="composer">
  <div id="modebar"><span class="chip" id="modechip"></span></div>
  <div id="attachprev"><img class="thumb" id="attachimg"><span>صورة مرفقة</span><button class="ibtn" id="attachx">✕</button></div>
  <div id="inputrow">
    <button class="ibtn" id="modes" title="الأدوات">✨</button>
    <button class="ibtn" id="attach" title="إرفاق صورة">📎</button>
    <button class="ibtn" id="mic" title="إدخال صوتي">🎙</button>
    <textarea id="input" rows="1" placeholder="اكتب أي حاجة..." autofocus></textarea>
    <button class="ibtn" id="send" title="إرسال">➤</button>
  </div>
  <div id="modemenu">
    <button data-mode="search">🔎 بحث في الويب بمصادر <small style="opacity:.65">(خدمة مجانية — قد تكون مشغولة)</small></button>
    <button data-mode="image">🎨 توليد صورة <small style="opacity:.65">(خدمة مجانية — قد تكون مشغولة)</small></button>
    <button data-mode="">✕ إلغاء الوضع</button>
  </div>
  <input type="file" id="file" accept="image/*" hidden>
</div>

<script>
"use strict";
const API = "https://chatluck-api.onrender.com";
const $ = id => document.getElementById(id);
const msgsEl = $("msgs"), inputEl = $("input"), errEl = $("err");

const PERSONAS = [
  { id: "general", name: "مساعد عام", sys: "" },
  { id: "deep", name: "تفكير عميق", sys: "حلّل كل سؤال خطوة بخطوة بمنطق واضح قبل الإجابة، واذكر البدائل والمقايضات." },
  { id: "fast", name: "سريع وصريح", sys: "إجابات مباشرة وقصيرة جدًا، صراحة كاملة بلا مجاملة، مع روح فكاهة خفيفة." },
  { id: "coder", name: "خبير برمجة", sys: "أنت مهندس برمجيات خبير. اكتب كودًا نظيفًا موثقًا واشرح القرارات التقنية باختصار." },
  { id: "marketer", name: "خبير تسويق", sys: "أنت خبير تسويق ومحتوى. اقترح أفكارًا عملية ونصوصًا جاهزة للنشر بفهم للجمهور المصري والعربي." },
  { id: "student", name: "مساعد دراسة", sys: "أنت مساعد دراسة صبور. اشرح ببساطة وبأمثلة، ولخّص، وضع أسئلة مراجعة." },
  { id: "translator", name: "مترجم فوري", sys: "أنت مترجم محترف. ترجم كل ما يصلك بين العربية والإنجليزية. أخرج الترجمة فقط دون شرح." }
];

const state = {
  token: null, conversationId: null, persona: "general", personaSent: false,
  mode: "", attach: null, sending: false, tts: localStorage.getItem("nexus_tts") === "1"
};

/* ---------- account: auto device account, no key needed ---------- */
function uuid() { return ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g, c => (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16)); }

async function ensureToken(forceLogin) {
  let acc = JSON.parse(localStorage.getItem("nexus_acc") || "null");
  if (!acc) {
    acc = { email: "nexus-" + uuid() + "@nexus.app", password: "nx-" + uuid() + uuid() };
    const r = await fetch(API + "/v1/auth/register", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email: acc.email, password: acc.password, display_name: "Nexus" })
    });
    if (!r.ok) throw new Error("تعذر تجهيز الحساب (" + r.status + ")");
    const j = await r.json();
    acc.token = j.access_token;
    localStorage.setItem("nexus_acc", JSON.stringify(acc));
  } else if (forceLogin || !acc.token) {
    const r = await fetch(API + "/v1/auth/login", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email: acc.email, password: acc.password })
    });
    if (!r.ok) { localStorage.removeItem("nexus_acc"); return ensureToken(false); }
    acc.token = (await r.json()).access_token;
    localStorage.setItem("nexus_acc", JSON.stringify(acc));
  }
  return acc.token;
}

async function apiFetch(path, opts, retried) {
  const token = await ensureToken(false);
  opts.headers = Object.assign({ "Authorization": "Bearer " + token }, opts.headers || {});
  const r = await fetch(API + path, opts);
  if (r.status === 401 && !retried) { await ensureToken(true); return apiFetch(path, opts, true); }
  return r;
}

/* ---------- personas ---------- */
function renderPersonas() {
  $("personas").innerHTML = "";
  PERSONAS.forEach(p => {
    const b = document.createElement("button");
    b.className = "chip" + (state.persona === p.id ? " on" : "");
    b.textContent = p.name;
    b.onclick = () => { state.persona = p.id; renderPersonas(); };
    $("personas").appendChild(b);
  });
}

/* ---------- messages ---------- */
function addMsg(role, text, attachB64) {
  const d = document.createElement("div");
  d.className = "msg " + (role === "user" ? "user" : "bot");
  if (attachB64) {
    const img = document.createElement("img");
    img.className = "att"; img.src = "data:image/jpeg;base64," + attachB64;
    d.appendChild(img);
  }
  const span = document.createElement("span");
  span.textContent = text;
  d.appendChild(span);
  msgsEl.appendChild(d);
  msgsEl.scrollTop = msgsEl.scrollHeight;
  return span;
}
function clearEmpty() { const e = msgsEl.querySelector(".empty"); if (e) e.remove(); }
function showEmpty() {
  msgsEl.innerHTML = '<div class="empty"><div class="star">✦</div><h2>إزايك؟ اسألني أي حاجة</h2><div>محادثة، بحث بمصادر، صور، ترجمة — كلها هنا</div></div>';
}
let typingEl = null;
function showTyping() {
  hideTyping();
  typingEl = document.createElement("div");
  typingEl.className = "typing";
  typingEl.innerHTML = 'بيرد <span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>';
  msgsEl.appendChild(typingEl);
  msgsEl.scrollTop = msgsEl.scrollHeight;
}
function hideTyping() { if (typingEl) { typingEl.remove(); typingEl = null; } }

function speak(text) {
  if (!state.tts || !window.speechSynthesis) return;
  speechSynthesis.cancel();
  const clean = text.replace(/[*#`>\-]+/g, " ").replace(/\[[^]]*\]\([^)]*\)/g, " ").slice(0, 3000);
  const u = new SpeechSynthesisUtterance(clean);
  u.lang = "ar-EG";
  speechSynthesis.speak(u);
}

/* ---------- send ---------- */
async function send() {
  const text = inputEl.value.trim();
  if ((!text && !state.attach) || state.sending) return;
  state.sending = true;
  $("send").disabled = true;
  errEl.textContent = "";
  inputEl.value = "";
  autoGrow();
  clearEmpty();

  const attach = state.attach;
  clearAttach();
  const mode = state.mode;
  if (mode === "image") { doImageGen(text); finishSend(); return; }

  addMsg("user", text || "حلّل هذه الصورة", attach && attach.b64);
  showTyping();

  try {
    if (mode === "search") {
      const r = await apiFetch("/v1/research", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query: text, language: "ar" })
      });
      hideTyping();
      if (!r.ok) throw new Error("البحث فشل (" + r.status + ")");
      const j = await r.json();
      const span = addMsg("bot", j.answer);
      if (j.sources && j.sources.length) {
        const box = document.createElement("div");
        box.className = "sources";
        box.innerHTML = "<b>المصادر:</b>";
        j.sources.forEach(s => {
          const a = document.createElement("a");
          a.href = s.url || s.uri || "#"; a.target = "_blank"; a.rel = "noopener";
          a.textContent = s.title || s.url || s.uri;
          box.appendChild(a);
        });
        span.parentElement.appendChild(box);
      }
      speak(j.answer);
    } else {
      let msg = text || "حلّل هذه الصورة: صف ما فيها بالتفصيل.";
      const p = PERSONAS.find(x => x.id === state.persona);
      if (p && p.sys && !state.personaSent) msg = "تعليمات: " + p.sys + "\n\n" + msg;
      const body = { message: msg, stream: true };
      if (state.conversationId) body.conversation_id = state.conversationId;
      if (attach) body.attachments = [{ mime_type: "image/jpeg", data_base64: attach.b64 }];

      const r = await apiFetch("/v1/chat", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });
      if (!r.ok) {
        hideTyping();
        const t = await r.text().catch(() => "");
        throw new Error(r.status === 429 ? "ضغط على الخدمة المجانية، جرّب بعد دقيقة." : "خطأ " + r.status + " " + t.slice(0, 120));
      }
      state.personaSent = true;
      const reader = r.body.getReader();
      const dec = new TextDecoder();
      let buf = "", full = "", span = null;
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        const events = buf.split("\n\n");
        buf = events.pop();
        for (const ev of events) {
          const mEvent = ev.match(/^event: (\w+)/m);
          const mData = ev.match(/^data: (.*)$/m);
          if (!mData) continue;
          let data; try { data = JSON.parse(mData[1]); } catch { continue; }
          if (mEvent && mEvent[1] === "meta" && data.conversation_id) {
            state.conversationId = data.conversation_id;
          } else if (mEvent && mEvent[1] === "token" && data.content) {
            if (!span) { hideTyping(); span = addMsg("bot", ""); }
            full += data.content;
            span.textContent = full;
            msgsEl.scrollTop = msgsEl.scrollHeight;
          }
        }
      }
      hideTyping();
      if (!full) addMsg("bot", "…");
      else speak(full);
    }
  } catch (e) {
    hideTyping();
    errEl.textContent = (e.message || "حصل خطأ") + " — لو أول مرة تفتح، السيرفر بيصحى، جرّب تاني بعد ثواني.";
  }
  finishSend();
}
function finishSend() { state.sending = false; $("send").disabled = false; inputEl.focus(); }

/* ---------- image generation (Pollinations, no key) ---------- */
function doImageGen(prompt) {
  if (!prompt) { errEl.textContent = "اكتب وصف الصورة الأول."; return; }
  addMsg("user", "🎨 " + prompt);
  showTyping();
  const url = "https://image.pollinations.ai/prompt/" + encodeURIComponent(prompt) + "?width=1024&height=1024&nologo=true&seed=" + Math.floor(Math.random() * 1e6);
  const img = new Image();
  img.onload = () => {
    hideTyping();
    const span = addMsg("bot", "");
    img.className = "att"; img.style.cursor = "pointer";
    img.onclick = () => window.open(url, "_blank");
    span.parentElement.insertBefore(img, span);
    span.textContent = "اضغط على الصورة لفتحها بحجم كامل";
  };
  img.onerror = () => { hideTyping(); errEl.textContent = "توليد الصورة فشل — خدمة Pollinations المجانية مشغولة، جرّب بعد شوية."; };
  img.src = url;
}

/* ---------- attachments ---------- */
function clearAttach() { state.attach = null; $("attachprev").style.display = "none"; $("file").value = ""; }
$("attach").onclick = () => $("file").click();
$("attachx").onclick = clearAttach;
$("file").onchange = e => {
  const f = e.target.files[0];
  if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    const img = new Image();
    img.onload = () => {
      const max = 1024, scale = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      const b64 = c.toDataURL("image/jpeg", 0.82).split(",")[1];
      state.attach = { b64 };
      $("attachimg").src = "data:image/jpeg;base64," + b64;
      $("attachprev").style.display = "flex";
    };
    img.src = rd.result;
  };
  rd.readAsDataURL(f);
};

/* ---------- modes ---------- */
const MODES = { search: "🔎 بحث بمصادر", image: "🎨 توليد صورة" };
$("modes").onclick = e => { e.stopPropagation(); const m = $("modemenu"); m.style.display = m.style.display === "block" ? "none" : "block"; };
document.addEventListener("click", () => $("modemenu").style.display = "none");
$("modemenu").querySelectorAll("button").forEach(b => {
  b.onclick = () => {
    state.mode = b.dataset.mode;
    if (state.mode) {
      $("modechip").textContent = MODES[state.mode] + " ✕";
      $("modebar").style.display = "block";
      inputEl.placeholder = state.mode === "image" ? "صف الصورة المطلوبة..." : "اكتب سؤال البحث...";
    } else {
      $("modebar").style.display = "none";
      inputEl.placeholder = "اكتب أي حاجة...";
    }
  };
});
$("modechip").onclick = () => { state.mode = ""; $("modebar").style.display = "none"; inputEl.placeholder = "اكتب أي حاجة..."; };

/* ---------- voice input ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false;
$("mic").onclick = () => {
  if (!SR) { errEl.textContent = "المتصفح ده مش بيدعم الإدخال الصوتي — جرّب كروم."; return; }
  if (listening) { rec.stop(); return; }
  rec = new SR();
  rec.lang = "ar-EG"; rec.interimResults = false; rec.maxAlternatives = 1;
  rec.onresult = e => { inputEl.value = (inputEl.value + " " + e.results[0][0].transcript).trim(); autoGrow(); };
  rec.onend = () => { listening = false; $("mic").classList.remove("rec"); };
  rec.onerror = () => { listening = false; $("mic").classList.remove("rec"); };
  rec.start();
  listening = true; $("mic").classList.add("rec");
};

/* ---------- tts toggle ---------- */
function renderTts() { $("ttsbtn").textContent = state.tts ? "🔊 صوت" : "🔇 صوت"; }
$("ttsbtn").onclick = () => {
  state.tts = !state.tts;
  localStorage.setItem("nexus_tts", state.tts ? "1" : "0");
  if (!state.tts && window.speechSynthesis) speechSynthesis.cancel();
  renderTts();
};

/* ---------- misc ---------- */
$("newchat").onclick = () => {
  state.conversationId = null; state.personaSent = false; state.mode = "";
  $("modebar").style.display = "none";
  if (window.speechSynthesis) speechSynthesis.cancel();
  showEmpty(); inputEl.focus();
};
$("send").onclick = send;
inputEl.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
function autoGrow() { inputEl.style.height = "auto"; inputEl.style.height = Math.min(120, inputEl.scrollHeight) + "px"; }
inputEl.addEventListener("input", autoGrow);

renderPersonas(); renderTts(); showEmpty();
ensureToken(false).catch(() => {}); // warm the account + Render in the background
</script>
</body>
</html>
