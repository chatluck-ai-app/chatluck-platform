# Render blueprint: Chat Luck AI backend (free web service + free Postgres).
# One-time setup: connect the repo in Render, choose "Blueprint", set the secret
# env vars marked sync:false in the dashboard (GEMINI_API_KEY, GROQ_API_KEY,
# OPENROUTER_API_KEY, JWT_SECRET).
services:
  - type: web
    name: chatluck-api
    runtime: docker
    rootDir: .
    dockerfilePath: ./backend/Dockerfile
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chatluck-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
databases:
  - name: chatluck-db
    databaseName: chatluck
    plan: free
