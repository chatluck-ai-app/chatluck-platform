name: Keep Render services warm

# Render's free tier sleeps services after ~15 minutes without traffic, and a
# cold start takes ~50s. Ping the API and web app every 10 minutes so a real
# user never pays that cold-start penalty. Free: runs on GitHub Actions.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping API and web
        run: |
          curl -s -o /dev/null -w "api %{http_code} %{time_total}s\n" https://chatluck-api.onrender.com/v1/models || true
          curl -s -o /dev/null -w "web %{http_code} %{time_total}s\n" https://chatluck-web.onrender.com/ || true
